[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waters"
version = "0.1.0"
description = "Mass-balance flood model for the Guaiba (Porto Alegre, Brazil): inflow by river, inferred outflow and 72 h stage forecast"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "João Bahi de Souza" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "streamlit>=1.36",
    "plotly>=5.22",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
]
geo = [
    "rasterio>=1.3",   # apenas para scripts/build_area_curve.py e build_inundation.py
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/waters"]
omit = ["src/waters/dashboard/*"]
